apiVersion: v1
kind: Pod
metadata:
  name: cloud-credentials-accessed-by-network-utility
spec:
  restartPolicy: Never
  containers:
  - name: cloud-credentials-accessed-by-network-utility
    image: angelrita/base-ubuntu:latest
    #imagePullPolicy: Never
    command: ['bash']
    args: ['-c', 'bash -c "curl -X PUT http://169.254.169.254/latest/api/token"; sleep infinity']
