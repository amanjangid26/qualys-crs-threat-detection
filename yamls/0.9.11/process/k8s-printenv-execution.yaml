apiVersion: v1
kind: Pod
metadata:
  name: k8s-printenv-execution
spec:
  restartPolicy: Never
  containers:
    - name: k8s-printenv-execution
      image: angelrita/base-ubuntu:latest
      command: ['sh']
      args: ['-c', 'python3 -c "import subprocess; subprocess.call(\"printenv\")"; sleep infinity']
