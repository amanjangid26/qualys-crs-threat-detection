apiVersion: v1
kind: Pod
metadata:
  name: recon-suid-binaries-search
spec:
  restartPolicy: Never
  containers:
    - name: recon-suid-binaries-search
      image: angelrita/base-ubuntu:latest
      command: ['sh']
      args: ['-c', 'find / -xdev -type f -perm -4000 -ls 2>/dev/null; sleep infinity']
