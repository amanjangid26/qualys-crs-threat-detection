#command: kubectl create token for ServiceAccount (T1528)
#note: process_name should be kubectl, process_cmd_line contains create and token

apiVersion: v1
kind: Pod
metadata:
  name: kubectl-token-minting-serviceaccount-abuse
spec:
  restartPolicy: Never
  containers:
  - name: kubectl-token-minting-serviceaccount-abuse
    image: angelrita/base-ubuntu:latest
    #imagePullPolicy: Never
    command: ['sh']
    args: ["-c", "kubectl create token default; sleep infinity"]
